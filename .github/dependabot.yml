version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: gradle
    directory: /AndroidClient
    schedule:
      interval: weekly
      day: monday
      time: "09:20"
      timezone: America/New_York
    open-pull-requests-limit: 5
    groups:
      android-dependencies:
        patterns:
          - "*"
