name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - eval/runtime-snapshot-2026-08-23
      - "ci/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repo-contracts:
    name: Repository contracts
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Repository contract tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Python syntax
        run: python -m compileall -q scripts tests
      - name: Shell syntax
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            echo "checking $file"
            bash -n "$file"
          done < <(find scripts -type f -name '*.sh' -print0)

  android:
    name: Android JVM + lint + APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: AndroidClient
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Unit tests, lint, and debug APK
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest lintDebug assembleDebug
      - name: Upload Android test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          if-no-files-found: ignore
          retention-days: 7
          path: |
            AndroidClient/app/build/reports/tests/
            AndroidClient/app/build/reports/lint-results-debug.*
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sidescreen-debug-apk
          if-no-files-found: error
          retention-days: 7
          path: AndroidClient/app/build/outputs/apk/debug/app-debug.apk

  macos:
    name: macOS Swift tests + release build
    runs-on: macos-14
    timeout-minutes: 25
    defaults:
      run:
        working-directory: MacHost
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Swift tests
        run: swift test -c debug --parallel
      - name: Release build
        run: swift build -c release
